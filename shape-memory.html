<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>形狀記憶列車</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#fff5df,#eef8ff,#effaf3);color:#243e50;font-family:'Microsoft JhengHei','Segoe UI',sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{text-align:center}h1{font-size:clamp(28px,5vw,42px);margin:12px}p{line-height:1.7}.badge{color:#557c77;font-weight:bold;letter-spacing:2px}.panel{background:#fff;border:2px solid #d5e5e9;border-radius:24px;padding:22px;box-shadow:0 12px 32px #25425412}button,select{font:inherit;font-weight:bold;color:inherit;background:white;border:2px solid #b7cfda;border-radius:12px;padding:12px;cursor:pointer;min-height:48px}button:disabled{opacity:.55;cursor:default}button:focus-visible,select:focus-visible{outline:4px solid #efb732;outline-offset:3px}.controls,.actions,.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}.primary{background:#236e75;color:white;border-color:#236e75}#status{text-align:center;font-weight:bold;font-size:20px;min-height:34px}.track{display:flex;gap:10px;overflow-x:auto;padding:14px 4px 24px;scroll-behavior:smooth}.slot{flex:0 0 90px;text-align:center}.tile{height:88px;border:2px solid #b6ccd8;border-radius:16px;background:#f4f8fa;display:grid;place-items:center}.tile svg{width:66px;height:66px}.tile.active{background:#fff3c9;border-color:#d79a26}.number{font-size:14px;color:#5b707c;margin:7px}.palette button{display:grid;justify-items:center;gap:5px;min-width:78px}.palette svg{width:46px;height:46px}.actions{margin-top:20px}#feedback{padding:14px;background:#edf7ee;border-radius:12px;line-height:1.8}footer{color:#5b707c;text-align:center;font-size:14px}[hidden]{display:none!important}@media(max-width:500px){main{padding:12px}.panel{padding:12px}.slot{flex-basis:74px}.tile{height:74px}.tile svg{width:56px;height:56px}}
.review-slot{flex-basis:130px}.tile.correct{background:#e3f6e9;border:3px solid #258151}.tile.wrong{background:#fff0e5;border:3px solid #bd672a}.result-mark{font-weight:bold;margin:8px 0;color:#246643}.review-slot.wrong .result-mark{color:#98501e}.correction{font-size:14px;margin-top:8px}.correction svg{display:block;width:48px;height:48px;margin:4px auto}.answer-label{font-size:13px;margin-bottom:5px;color:#5b707c}
</style>
<main><header><span class="badge">LOOK · REMEMBER · REPLAY</span><h1>形狀記憶列車</h1><p>由左至右，記住每個形狀。全部消失後，按次序揀返出嚟！</p></header>
<section class="panel"><div class="controls"><label>難度 <select id="level"><option value="0">★ 一星</option><option value="1">★★ 二星</option><option value="2">★★★ 三星</option><option value="3">★★★★ 四星</option><option value="4">★★★★★ 五星</option></select></label><button id="start" class="primary">開始新題</button></div><p id="description" style="text-align:center"></p><p id="status" role="status" aria-live="polite">準備好記住圖形嗎？</p><div id="track" class="track" aria-label="由左至右的形狀次序"></div>
<div id="recall" hidden><p>依次點選圖形填入空格；同一形狀可以出現多次。</p><div id="palette" class="palette"></div><div class="actions"><button id="undo">退回一格</button><button id="check" class="primary">核對答案</button></div></div><div id="feedback" hidden></div><div class="actions"><button id="replay" hidden>重看同一題</button></div></section><footer>不設作答時限。鑽石是寶石圖案，菱形是四邊形。切換頁面會中止播放，可重新觀看。</footer></main>
<script src="shape-memory.js?v=20260930-feedback"></script>
</html>
