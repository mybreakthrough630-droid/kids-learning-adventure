<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文認字小學堂</title>
  <link rel="stylesheet" href="word-recognition.css?v=20260812-3">
</head>
<body data-language="zh">
  <main class="page">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Primary 2 · Chinese Word Recognition</p>
        <h1>中文認字小學堂</h1>
        <p>睇大字、聽廣東話讀音、了解詞義，再試吓自己讀。</p>
      </div>
      <div class="hero-badge" aria-hidden="true">字</div>
    </header>

    <div class="learning-layout">
      <aside class="category-panel">
        <h2>選擇種類</h2>
        <nav class="category-list" id="categoryList" aria-label="生字種類"></nav>
      </aside>

      <section class="word-card" id="wordCard" aria-live="polite">
        <div class="progress-row">
          <span class="category-title" id="categoryTitle"></span>
          <span class="score" id="score">⭐ 0</span>
        </div>
        <p class="word" id="word"></p>
        <p class="pronunciation" id="pronunciation"></p>
        <div class="sound-builder" id="soundBuilder"></div>
        <p class="teaching-note" id="teachingNote"></p>
        <p class="meaning" id="meaning"></p>
        <div class="actions">
          <button class="action-button listen" id="listenBtn" type="button">🔊 聽標準讀音</button>
          <button class="action-button listen" id="slowBtn" type="button">🐢 慢速再聽</button>
          <button class="action-button mic" id="micBtn" type="button">🎤 用咪高峰試讀</button>
          <button class="action-button know" id="knowBtn" type="button">✅ 我讀啱喇</button>
          <button class="action-button next" id="nextBtn" type="button">➡ 下一題</button>
        </div>
        <div class="feedback" id="feedback">先聽一次，再大聲讀出生字。</div>
        <p class="support-note" id="supportNote"></p>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </section>
    </div>
  </main>
  <script src="word-recognition-data.js?v=20260812-3"></script>
  <script src="word-recognition-extra-data.js?v=20260812-3"></script>
  <script src="word-recognition.js?v=20260812-3"></script>
</body>
</html>
