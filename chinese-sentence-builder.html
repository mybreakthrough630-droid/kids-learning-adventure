<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文句子重組練習</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24364b;
      --muted: #66758a;
      --line: #d7dee8;
      --paper: #fffdf5;
      --panel: #ffffff;
      --blue: #246bb2;
      --green: #167a4a;
      --red: #b94b27;
      --yellow: #f4cf61;
      --teal: #148477;
      --shadow: 0 16px 38px rgba(36, 54, 75, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Avenir Next", "PingFang HK", "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(244, 207, 97, 0.4), transparent 24rem),
        radial-gradient(circle at 91% 12%, rgba(89, 183, 175, 0.25), transparent 24rem),
        linear-gradient(135deg, #fffdf5 0%, #f2f9ff 52%, #f4fff8 100%);
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .challenge-label {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 2px solid #d8b23e;
      border-radius: 8px;
      background: #fff1b8;
      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 900;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 18px;
      align-items: start;
    }

    .workspace,
    .side {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .workspace {
      padding: clamp(18px, 3vw, 30px);
    }

    .side {
      position: sticky;
      top: 14px;
      padding: 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .pill {
      min-height: 48px;
      padding: 8px 13px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #f8fbff;
      font-size: clamp(19px, 2.7vw, 27px);
      font-weight: 900;
    }

    .clue {
      margin: 0 0 18px;
      padding: 15px 16px;
      border-left: 8px solid var(--yellow);
      border-radius: 6px;
      background: #fff7d6;
      font-size: clamp(24px, 3.8vw, 36px);
      font-weight: 900;
      line-height: 1.25;
    }

    .zone-label {
      margin: 17px 0 9px;
      color: var(--muted);
      font-size: clamp(19px, 2.7vw, 25px);
      font-weight: 900;
    }

    .sentence-box,
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      align-content: flex-start;
      min-height: 112px;
      padding: 14px;
      border: 3px dashed #a8b3c5;
      border-radius: 8px;
      background: #f8fbff;
    }

    .sentence-box {
      min-height: 126px;
      background: #ffffff;
    }

    button {
      font: inherit;
    }

    .word {
      min-width: 68px;
      min-height: 58px;
      padding: 9px 15px;
      border: 3px solid #8fa0b4;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 5px 0 #cbd5e1;
      font-size: clamp(25px, 4.2vw, 39px);
      font-weight: 900;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .word:hover,
    .word:focus-visible {
      border-color: var(--blue);
      outline: 4px solid rgba(36, 107, 178, 0.18);
    }

    .word:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .answer-word {
      border-color: var(--blue);
      background: #eaf4ff;
      box-shadow: 0 5px 0 #9cc7ec;
    }

    .word.person { border-color: #3b82c4; background: #eaf4ff; }
    .word.time { border-color: #c99518; background: #fff7cf; }
    .word.place { border-color: #27926b; background: #e9faef; }
    .word.verb { border-color: #d85c45; background: #fff0eb; }
    .word.adjective { border-color: #9158b5; background: #f7edff; }
    .word.modifier { border-color: #158a85; background: #e8f9f7; }

    .word-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
    }

    .word-legend span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 5px;
      border: 2px solid currentColor;
      border-radius: 3px;
      vertical-align: -1px;
    }

    .legend-person { color: #2569a3; }
    .legend-time { color: #98700d; }
    .legend-place { color: #16734f; }
    .legend-verb { color: #b84431; }
    .legend-adjective { color: #774296; }
    .legend-modifier { color: #126f6b; }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .control {
      min-height: 58px;
      padding: 9px 10px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      font-size: clamp(18px, 2.6vw, 25px);
      font-weight: 900;
      cursor: pointer;
    }

    .check { background: var(--green); }
    .clear { background: #677386; }
    .hint { background: #8b4db2; }
    .next { background: var(--blue); }

    .feedback {
      min-height: 72px;
      margin-top: 17px;
      padding: 13px 15px;
      border: 2px solid #bfdbfe;
      border-radius: 8px;
      background: #eef6ff;
      font-size: clamp(23px, 3.5vw, 34px);
      font-weight: 900;
      line-height: 1.25;
    }

    .feedback.good {
      color: var(--green);
      border-color: #86d5a9;
      background: #eaf9f0;
    }

    .feedback.try {
      color: var(--red);
      border-color: #f0bd9f;
      background: #fff3e9;
    }

    .side h2 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .progress {
      width: 100%;
      height: 21px;
      margin: 11px 0 13px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #2ab477, #2f79c6);
      transition: width 180ms ease;
    }

    .score-line {
      margin: 8px 0 13px;
      font-size: 22px;
      font-weight: 900;
    }

    .level-menu {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .level-button {
      min-height: 54px;
      padding: 8px 10px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      text-align: left;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .level-button span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
    }

    .level-button.active {
      border-color: var(--blue);
      background: #eaf4ff;
      color: #174f88;
    }

    .level-button.done {
      border-color: #6ac28f;
    }

    .sound-toggle {
      width: 100%;
      min-height: 50px;
      margin-top: 6px;
      border: 0;
      border-radius: 8px;
      background: var(--teal);
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .instructions {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 850px) {
      main { padding: 13px; }
      .app { grid-template-columns: 1fr; }
      .side { position: static; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 450px) {
      .topbar { align-items: flex-start; }
      .challenge-label { font-size: 15px; }
      .word { min-width: 58px; padding: 8px 11px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <h1>中文句子重組</h1>
      <div class="challenge-label">五級挑戰</div>
    </header>

    <div class="app">
      <section class="workspace" aria-labelledby="levelLabel">
        <div class="meta">
          <span class="pill" id="levelLabel">Level 1：短句</span>
          <span class="pill" id="questionLabel">本級練習 1</span>
        </div>

        <p class="clue" id="clue">情境提示</p>

        <div class="zone-label">我的句子</div>
        <div class="sentence-box" id="answer" aria-live="polite"></div>

        <div class="zone-label">請按正確次序點選詞語和標點</div>
        <div class="word-legend" aria-label="詞語顏色分類">
          <span class="legend-person">人物</span>
          <span class="legend-time">時間</span>
          <span class="legend-place">地點</span>
          <span class="legend-verb">動詞</span>
          <span class="legend-adjective">形容詞</span>
          <span class="legend-modifier">修飾語</span>
          <span>其他詞語</span>
        </div>
        <div class="word-bank" id="wordBank"></div>

        <div class="controls">
          <button class="control check" type="button" id="checkBtn">檢查</button>
          <button class="control clear" type="button" id="clearBtn">重來</button>
          <button class="control hint" type="button" id="hintBtn">提示</button>
          <button class="control next" type="button" id="nextBtn">隨機新句子</button>
        </div>

        <div class="feedback" id="feedback">把詞語排成一句完整中文句子吧！</div>
      </section>

      <aside class="side">
        <h2>本級進度</h2>
        <div class="progress" aria-label="本級進度"><span id="progressBar"></span></div>
        <p class="score-line">答啱：<span id="levelScore">0</span> / 5 句</p>
        <div class="level-menu" id="levelMenu" aria-label="五個中文程度"></div>
        <button class="sound-toggle" type="button" id="soundBtn">音效：開</button>
        <p class="instructions">點選詞語放入「我的句子」。點已選詞語可放回去。每級答啱5句便完成該級。</p>
      </aside>
    </div>
  </main>

  <script>
    const levels = [
      { name: "Level 1：短句", detail: "分辨人物、動詞和形容詞" },
      { name: "Level 2：完整句", detail: "時間、人物、地點和事情" },
      { name: "Level 3：描寫句", detail: "加入形容詞和修飾語" },
      { name: "Level 4：連接句", detail: "完整情境加連接詞" },
      { name: "Level 5：複合句", detail: "條件、轉折和較長句子" }
    ];

    const sentenceParts = {
      level1: {
        subjects: ["我", "哥哥", "妹妹", "小明", "小美"],
        actions: [
          { verb: "閱讀", object: "圖書", clue: "誰喜歡看書？" },
          { verb: "拿着", object: "雨傘", clue: "誰手上有雨傘？" },
          { verb: "看見", object: "小鳥", clue: "誰看見天空的小鳥？" },
          { verb: "吃", object: "蘋果", clue: "誰吃水果？" },
          { verb: "抱着", object: "小熊", clue: "誰抱着玩具？" }
        ],
        feelings: ["開心", "勇敢", "用心", "安靜", "有禮貌"]
      },
      level2: {
        people: ["我", "哥哥", "姐姐", "同學們"],
        times: ["每天", "早上", "放學後", "星期日"],
        places: ["在家中", "在課室裏", "在圖書館裏", "在操場上"],
        actions: [
          { verb: "閱讀", object: "圖書" },
          { verb: "完成", object: "功課" },
          { verb: "喝", object: "牛奶" },
          { verb: "練習", object: "寫字" },
          { verb: "踢", object: "足球" }
        ]
      },
      level3: {
        times: ["今天早上", "星期日下午", "放學後", "晚飯後"],
        people: ["我們", "一家人", "同學們", "我和妹妹"],
        places: ["在學校裏", "在公園裏", "在操場上", "在客廳裏"],
        scenes: [
          { adverb: "開心地", verb: "唱", amount: "一首", adjective: "好聽的", noun: "歌" },
          { adverb: "愉快地", verb: "吃", amount: "一頓", adjective: "豐富的", noun: "午餐" },
          { adverb: "用心地", verb: "畫", amount: "一幅", adjective: "漂亮的", noun: "圖畫" },
          { adverb: "安靜地", verb: "閱讀", amount: "一本", adjective: "有趣的", noun: "故事書" }
        ]
      },
      level4: {
        times: ["今天早上", "放學後", "星期六", "晚飯後"],
        reasons: [
          { reasonNoun: "雨勢", reasonAdjective: "很大", subject: "我", place: "在學校裏", verb: "帶", object: "雨傘" },
          { reasonNoun: "弟弟", reasonAdjective: "很餓", subject: "媽媽", place: "在家中", verb: "給", object: "他一塊麵包" },
          { reasonNoun: "默書內容", reasonAdjective: "很困難", subject: "姐姐", place: "在圖書館裏", verb: "溫習", object: "中文" },
          { reasonNoun: "天氣", reasonAdjective: "很炎熱", subject: "我們", place: "在公園裏", verb: "喝", object: "清水" }
        ],
        sequences: [
          { subject: "我", place: "在家中", firstVerb: "整理", firstObject: "書包", secondVerb: "閱讀", secondObject: "故事書" },
          { subject: "妹妹", place: "在家中", firstVerb: "清洗", firstObject: "雙手", secondVerb: "吃", secondObject: "晚飯" },
          { subject: "同學們", place: "在學校裏", firstVerb: "排好", firstObject: "隊伍", secondVerb: "進入", secondObject: "禮堂" },
          { subject: "爸爸", place: "在公園裏", firstVerb: "準備", firstObject: "食物", secondVerb: "享用", secondObject: "午餐" }
        ]
      },
      level5: {
        times: ["今天", "星期日早上", "放學後", "黃昏時"],
        conditions: [
          { conditionPerson: "大家", conditionVerb: "愛護", conditionObject: "環境", subject: "城市", place: "在社區裏", verb: "變得", object: "更加美麗" },
          { conditionPerson: "我", conditionVerb: "完成", conditionObject: "功課", subject: "媽媽", place: "在家中", verb: "帶", object: "我去玩" },
          { conditionPerson: "你", conditionVerb: "練習", conditionObject: "中文", subject: "中文能力", place: "在學校裏", verb: "得到", object: "進步" }
        ],
        contrasts: [
          { conditionNoun: "天氣", adjective: "很惡劣", subject: "同學們", place: "在學校裏", adverb: "仍然", verb: "完成", object: "課堂活動" },
          { conditionNoun: "題目", adjective: "很困難", subject: "哥哥", place: "在家中", adverb: "一直", verb: "思考", object: "解答方法" },
          { conditionNoun: "天氣", adjective: "很炎熱", subject: "我們", place: "在公園裏", adverb: "仍然", verb: "參加", object: "戶外活動" }
        ],
        events: [
          { eventPerson: "老師", eventVerb: "走進", eventObject: "課室", subject: "同學們", place: "在學校裏", adverb: "立刻", verb: "停止", object: "交談" },
          { eventPerson: "音樂", eventVerb: "開始", eventObject: "播放", subject: "小朋友們", place: "在公園裏", adverb: "快樂地", verb: "跳", object: "舞" },
          { eventPerson: "朋友", eventVerb: "遇到", eventObject: "困難", subject: "我", place: "在社區裏", adverb: "主動地", verb: "提供", object: "幫助" }
        ]
      }
    };

    const state = {
      level: 0,
      current: null,
      answer: [],
      bank: [],
      scores: [0, 0, 0, 0, 0],
      attempts: [0, 0, 0, 0, 0],
      solved: false,
      lastSentence: ["", "", "", "", ""],
      soundOn: true,
      audio: null
    };

    const els = {
      levelLabel: document.getElementById("levelLabel"),
      questionLabel: document.getElementById("questionLabel"),
      clue: document.getElementById("clue"),
      answer: document.getElementById("answer"),
      wordBank: document.getElementById("wordBank"),
      feedback: document.getElementById("feedback"),
      progressBar: document.getElementById("progressBar"),
      levelScore: document.getElementById("levelScore"),
      levelMenu: document.getElementById("levelMenu"),
      soundBtn: document.getElementById("soundBtn")
    };

    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("clearBtn").addEventListener("click", resetCurrent);
    document.getElementById("hintBtn").addEventListener("click", showHint);
    document.getElementById("nextBtn").addEventListener("click", nextQuestion);
    els.soundBtn.addEventListener("click", toggleSound);

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function token(text, type = "other") {
      return { text, type };
    }

    function sentenceText(parts) {
      return parts.map((part) => part.text).join("");
    }

    function makeQuestion(level) {
      if (level === 0) {
        if (Math.random() < 0.72) {
          const subject = pick(sentenceParts.level1.subjects);
          const action = pick(sentenceParts.level1.actions);
          return {
            clue: action.clue,
            parts: [
              token(subject, "person"),
              token(action.verb, "verb"),
              token(action.object),
              token("。")
            ]
          };
        }
        const subject = pick(sentenceParts.level1.subjects);
        const feeling = pick(sentenceParts.level1.feelings);
        return {
          clue: `${subject}有甚麼表現？`,
          parts: [
            token(subject, "person"),
            token("很"),
            token(feeling, "adjective"),
            token("。")
          ]
        };
      }

      if (level === 1) {
        const subject = pick(sentenceParts.level2.people);
        const time = pick(sentenceParts.level2.times);
        const place = pick(sentenceParts.level2.places);
        const action = pick(sentenceParts.level2.actions);
        return {
          clue: "請把時間、人物、地點和事情排好。",
          parts: [
            token(time, "time"), token("，"), token(subject, "person"),
            token(place, "place"), token(action.verb, "verb"),
            token(action.object), token("。")
          ]
        };
      }

      if (level === 2) {
        const time = pick(sentenceParts.level3.times);
        const subject = pick(sentenceParts.level3.people);
        const place = pick(sentenceParts.level3.places);
        const scene = pick(sentenceParts.level3.scenes);
        return {
          clue: "留意修飾語、動詞和形容詞的位置。",
          parts: [
            token(time, "time"), token("，"), token(subject, "person"),
            token(place, "place"), token(scene.adverb, "modifier"),
            token(scene.verb, "verb"), token(scene.amount),
            token(scene.adjective, "adjective"), token(scene.noun), token("。")
          ]
        };
      }

      if (level === 3) {
        const time = pick(sentenceParts.level4.times);
        if (Math.random() < 0.55) {
          const item = pick(sentenceParts.level4.reasons);
          return {
            clue: "請用「因為……所以……」連接原因和結果。",
            parts: [
              token(time, "time"), token("，"), token("因為"),
              token(item.reasonNoun), token(item.reasonAdjective, "adjective"),
              token("，"), token("所以"), token(item.subject, "person"),
              token(item.place, "place"), token(item.verb, "verb"),
              token(item.object), token("。")
            ]
          };
        }
        const item = pick(sentenceParts.level4.sequences);
        return {
          clue: "請把先後次序排正確。",
          parts: [
            token(time, "time"), token("，"), token(item.subject, "person"),
            token(item.place, "place"), token("先"), token(item.firstVerb, "verb"),
            token(item.firstObject), token("，"), token("再"),
            token(item.secondVerb, "verb"), token(item.secondObject), token("。")
          ]
        };
      }

      const time = pick(sentenceParts.level5.times);
      const pattern = Math.floor(Math.random() * 3);
      if (pattern === 0) {
        const item = pick(sentenceParts.level5.conditions);
        return {
          clue: "請用「如果……就會……」組成條件句。",
          parts: [
            token(time, "time"), token("，"), token("如果"),
            token(item.conditionPerson, "person"), token(item.conditionVerb, "verb"),
            token(item.conditionObject), token("，"), token(item.subject, "person"),
            token(item.place, "place"), token("就會"), token(item.verb, "verb"),
            token(item.object), token("。")
          ]
        };
      }
      if (pattern === 1) {
        const item = pick(sentenceParts.level5.contrasts);
        return {
          clue: "請用「雖然……但是……」表達轉折。",
          parts: [
            token(time, "time"), token("，"), token("雖然"),
            token(item.conditionNoun), token(item.adjective, "adjective"), token("，"), token("但是"),
            token(item.subject, "person"), token(item.place, "place"),
            token(item.adverb, "modifier"), token(item.verb, "verb"),
            token(item.object), token("。")
          ]
        };
      }
      const item = pick(sentenceParts.level5.events);
      return {
        clue: "事情發生時，人物有甚麼反應？",
        parts: [
          token(time, "time"), token("，"), token("當"),
          token(item.eventPerson), token(item.eventVerb, "verb"),
          token(item.eventObject), token("的時候"), token("，"),
          token(item.subject, "person"), token(item.place, "place"),
          token(item.adverb, "modifier"), token(item.verb, "verb"),
          token(item.object), token("。")
        ]
      };
    }

    function createRandomQuestion(level) {
      let question = makeQuestion(level);
      let sentence = sentenceText(question.parts);
      for (let attempt = 0; attempt < 8 && sentence === state.lastSentence[level]; attempt++) {
        question = makeQuestion(level);
        sentence = sentenceText(question.parts);
      }
      state.lastSentence[level] = sentence;
      return question;
    }

    function shuffledParts(parts) {
      const items = parts.map((part, index) => ({
        id: `${Date.now()}-${index}`,
        text: part.text,
        type: part.type
      }));
      let mixed = shuffle(items);
      for (let attempt = 0; attempt < 6 && mixed.map((item) => item.text).join("") === sentenceText(parts); attempt++) {
        mixed = shuffle(items);
      }
      if (mixed.length > 2 && mixed.map((item) => item.text).join("") === sentenceText(parts)) {
        [mixed[0], mixed[1]] = [mixed[1], mixed[0]];
      }
      return mixed;
    }

    function loadQuestion(level, existingQuestion = null) {
      state.level = level;
      state.current = existingQuestion || createRandomQuestion(level);
      state.answer = [];
      state.bank = shuffledParts(state.current.parts);
      state.solved = false;
      if (!existingQuestion) state.attempts[level] += 1;

      els.levelLabel.textContent = levels[level].name;
      els.questionLabel.textContent = `本級練習 ${state.attempts[level]}`;
      els.clue.textContent = state.current.clue;
      els.feedback.className = "feedback";
      els.feedback.textContent = "把詞語排成一句完整中文句子吧！";
      render();
    }

    function render() {
      renderWords(els.answer, state.answer, moveToBank, true);
      renderWords(els.wordBank, state.bank, moveToAnswer, false);
      els.levelScore.textContent = Math.min(state.scores[state.level], 5);
      els.progressBar.style.width = `${Math.min(state.scores[state.level], 5) * 20}%`;
      renderLevelMenu();
    }

    function renderWords(container, words, handler, isAnswer) {
      container.innerHTML = "";
      words.forEach((word) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `${isAnswer ? "word answer-word" : "word"} ${word.type || "other"}`;
        button.textContent = word.text;
        button.setAttribute("aria-label", word.text);
        button.addEventListener("click", () => handler(word.id));
        container.appendChild(button);
      });
    }

    function renderLevelMenu() {
      els.levelMenu.innerHTML = "";
      levels.forEach((level, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "level-button";
        if (index === state.level) button.classList.add("active");
        if (state.scores[index] >= 5) button.classList.add("done");
        button.innerHTML = `${level.name}<span>${level.detail}</span>`;
        button.addEventListener("click", () => {
          playSound("next");
          loadQuestion(index);
        });
        els.levelMenu.appendChild(button);
      });
    }

    function moveToAnswer(id) {
      const word = takeWord(state.bank, id);
      if (!word) return;
      state.answer.push(word);
      playSound("tap");
      clearFeedback();
      render();
    }

    function moveToBank(id) {
      const word = takeWord(state.answer, id);
      if (!word) return;
      state.bank.push(word);
      playSound("back");
      clearFeedback();
      render();
    }

    function takeWord(list, id) {
      const index = list.findIndex((word) => word.id === id);
      if (index === -1) return null;
      return list.splice(index, 1)[0];
    }

    function checkAnswer() {
      const answer = state.answer.map((word) => word.text).join("");
      const expected = sentenceText(state.current.parts);

      if (answer === expected && state.bank.length === 0) {
        if (!state.solved) {
          state.scores[state.level] += 1;
          state.solved = true;
        }
        els.feedback.className = "feedback good";
        els.feedback.textContent = state.scores[state.level] >= 5 && state.level < levels.length - 1
          ? `答啱了！${expected} 本級完成，可以挑戰下一級！`
          : `答啱了！${expected}`;
        playSound("correct");
      } else {
        els.feedback.className = "feedback try";
        els.feedback.textContent = "差一點點，請再檢查詞語次序和標點。";
        playSound("wrong");
      }
      render();
    }

    function resetCurrent() {
      const wasSolved = state.solved;
      playSound("clear");
      loadQuestion(state.level, state.current);
      state.solved = wasSolved;
    }

    function showHint() {
      const expected = state.current.parts;
      let position = 0;
      while (position < state.answer.length && state.answer[position].text === expected[position].text) {
        position += 1;
      }
      const next = (expected[position] || expected[0]).text;
      els.feedback.className = "feedback";
      els.feedback.textContent = `提示：第 ${position + 1} 個位置是「${next}」`;
      playSound("hint");
    }

    function nextQuestion() {
      let nextLevel = state.level;
      if (state.scores[state.level] >= 5 && state.level < levels.length - 1) {
        nextLevel += 1;
      }
      playSound("next");
      loadQuestion(nextLevel);
    }

    function clearFeedback() {
      els.feedback.className = "feedback";
      els.feedback.textContent = "很好，繼續排下去。";
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      els.soundBtn.textContent = state.soundOn ? "音效：開" : "音效：關";
      if (state.soundOn) playSound("hint");
    }

    function getAudio() {
      if (!state.audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        state.audio = new AudioContext();
      }
      if (state.audio.state === "suspended") state.audio.resume();
      return state.audio;
    }

    function playSound(kind) {
      if (!state.soundOn) return;
      const audio = getAudio();
      if (!audio) return;

      const sounds = {
        tap: [{ frequency: 520, start: 0, duration: 0.07, type: "sine", volume: 0.1 }],
        back: [{ frequency: 330, start: 0, duration: 0.07, type: "triangle", volume: 0.08 }],
        hint: [
          { frequency: 660, start: 0, duration: 0.08, type: "sine", volume: 0.1 },
          { frequency: 880, start: 0.08, duration: 0.1, type: "sine", volume: 0.1 }
        ],
        next: [
          { frequency: 440, start: 0, duration: 0.07, type: "triangle", volume: 0.09 },
          { frequency: 660, start: 0.07, duration: 0.1, type: "triangle", volume: 0.09 }
        ],
        clear: [{ frequency: 260, start: 0, duration: 0.08, type: "sine", volume: 0.07 }],
        wrong: [
          { frequency: 220, start: 0, duration: 0.1, type: "sawtooth", volume: 0.045 },
          { frequency: 180, start: 0.1, duration: 0.12, type: "sawtooth", volume: 0.04 }
        ],
        correct: [
          { frequency: 523.25, start: 0, duration: 0.07, type: "triangle", volume: 0.11 },
          { frequency: 659.25, start: 0.07, duration: 0.07, type: "triangle", volume: 0.11 },
          { frequency: 783.99, start: 0.14, duration: 0.08, type: "triangle", volume: 0.12 },
          { frequency: 1046.5, start: 0.24, duration: 0.12, type: "sine", volume: 0.1 }
        ]
      };

      (sounds[kind] || sounds.tap).forEach((note) => playNote(audio, note));
    }

    function playNote(audio, note) {
      const now = audio.currentTime + note.start;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = note.type;
      oscillator.frequency.setValueAtTime(note.frequency, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(note.volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + note.duration);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + note.duration + 0.03);
    }

    loadQuestion(0);
  </script>
</body>
</html>
