<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文句子重組練習</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #637083;
      --paper: #fffaf0;
      --panel: #ffffff;
      --line: #d8dee8;
      --blue: #2563eb;
      --green: #17803d;
      --red: #c2410c;
      --yellow: #f7d154;
      --shadow: 0 18px 44px rgba(31, 41, 55, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(247, 209, 84, 0.35), transparent 28rem),
        radial-gradient(circle at 90% 15%, rgba(37, 99, 235, 0.16), transparent 24rem),
        linear-gradient(135deg, #fffaf0 0%, #f1f7ff 100%);
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .stars {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 2px solid #d8b23e;
      border-radius: 8px;
      background: #fff1b8;
      font-size: clamp(17px, 2.3vw, 23px);
      font-weight: 900;
      white-space: nowrap;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    .workspace,
    .side {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(216, 222, 232, 0.95);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .workspace {
      padding: clamp(18px, 3vw, 30px);
    }

    .side {
      padding: 18px;
      position: sticky;
      top: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 14px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #f8fbff;
    }

    .meaning {
      margin: 0 0 18px;
      padding: 16px;
      border-left: 8px solid var(--yellow);
      background: #fff7d6;
      border-radius: 6px;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      line-height: 1.2;
    }

    .zone-label {
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: clamp(19px, 2.6vw, 26px);
      font-weight: 800;
    }

    .sentence-box,
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      min-height: 104px;
      padding: 14px;
      border: 3px dashed #a8b3c5;
      border-radius: 8px;
      background: #f8fbff;
    }

    .sentence-box {
      min-height: 122px;
      background: #ffffff;
    }

    button {
      font: inherit;
    }

    .word {
      min-width: 72px;
      min-height: 58px;
      padding: 10px 16px;
      border: 3px solid #94a3b8;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font-size: clamp(26px, 4.4vw, 42px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }

    .word:hover,
    .word:focus-visible {
      border-color: var(--blue);
      outline: 4px solid rgba(37, 99, 235, 0.18);
    }

    .word:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .answer-word {
      background: #eaf3ff;
      border-color: var(--blue);
      box-shadow: 0 5px 0 #93c5fd;
    }

    .word.person { border-color: #3b82c4; background: #eaf4ff; }
    .word.time { border-color: #c99518; background: #fff7cf; }
    .word.place { border-color: #27926b; background: #e9faef; }
    .word.verb { border-color: #d85c45; background: #fff0eb; }
    .word.adjective { border-color: #9158b5; background: #f7edff; }
    .word.conjunction { border-color: #158a85; background: #e8f9f7; }

    .word-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 800;
    }

    .word-legend span::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 5px;
      border: 2px solid currentColor;
      border-radius: 3px;
      vertical-align: -1px;
    }

    .legend-person { color: #2569a3; }
    .legend-time { color: #98700d; }
    .legend-place { color: #16734f; }
    .legend-verb { color: #b84431; }
    .legend-adjective { color: #774296; }
    .legend-conjunction { color: #126f6b; }

    .answer-token {
      display: inline-flex;
      align-items: stretch;
      gap: 5px;
    }

    .case-toggle {
      width: 48px;
      min-height: 58px;
      padding: 6px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .case-toggle:hover,
    .case-toggle:focus-visible {
      border-color: var(--blue);
      outline: 4px solid rgba(37, 99, 235, 0.18);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .control {
      min-height: 58px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: clamp(18px, 2.7vw, 26px);
      font-weight: 900;
      cursor: pointer;
    }

    .check {
      background: var(--green);
    }

    .clear {
      background: #6b7280;
    }

    .hint {
      background: #7c3aed;
    }

    .next {
      background: var(--blue);
    }

    .feedback {
      min-height: 72px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #eef6ff;
      border: 2px solid #bfdbfe;
      font-size: clamp(24px, 3.7vw, 36px);
      font-weight: 900;
      line-height: 1.25;
    }

    .feedback.good {
      color: var(--green);
      background: #eafbea;
      border-color: #86efac;
    }

    .feedback.try {
      color: var(--red);
      background: #fff3e8;
      border-color: #fed7aa;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .progress {
      width: 100%;
      height: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
      border: 2px solid #cbd5e1;
      margin: 12px 0 14px;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #2563eb);
      transition: width 180ms ease;
    }

    .score-line {
      margin: 10px 0;
      font-size: 24px;
      font-weight: 800;
    }

    .level-menu {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .sound-toggle {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: #0f766e;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      margin: 8px 0 4px;
    }

    .level-jump {
      min-height: 46px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
      padding: 8px 10px;
    }

    .level-jump.active {
      border-color: var(--blue);
      background: #eaf3ff;
      color: #1d4ed8;
    }

    .level-jump span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .level-jump.done::after {
      content: "完成";
      float: right;
      color: #15803d;
      font-size: 14px;
    }

    .small {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.35;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 14px;
    }

    .dot {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #ffffff;
      font-size: 16px;
      font-weight: 900;
    }

    .dot.done {
      color: #ffffff;
      background: var(--green);
      border-color: var(--green);
    }

    @media (max-width: 850px) {
      main {
        padding: 14px;
      }

      .topbar,
      .app {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .word {
        min-width: 64px;
      }
    }

    @media (max-width: 420px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>英文句子重組</h1>
      <div class="stars">五級挑戰</div>
    </div>

    <div class="app">
      <section class="workspace" aria-labelledby="question-title">
        <div class="meta">
          <span id="question-title" class="pill">本級練習 1</span>
          <span id="level" class="pill">Level 1</span>
        </div>

        <p id="meaning" class="meaning">中文意思</p>

        <div class="zone-label">我的句子</div>
        <div id="answer" class="sentence-box" aria-live="polite"></div>

        <div class="zone-label">請按正確次序點選英文詞語和標點</div>
        <div class="word-legend" aria-label="英文詞語顏色分類">
          <span class="legend-person">人物</span>
          <span class="legend-time">時間</span>
          <span class="legend-place">地點</span>
          <span class="legend-verb">動詞</span>
          <span class="legend-adjective">形容詞</span>
          <span class="legend-conjunction">連接詞</span>
          <span>其他詞語</span>
        </div>
        <div id="wordBank" class="word-bank"></div>

        <div class="controls">
          <button class="control check" type="button" id="checkBtn">檢查</button>
          <button class="control clear" type="button" id="clearBtn">重來</button>
          <button class="control hint" type="button" id="hintBtn">提示</button>
          <button class="control next" type="button" id="nextBtn">隨機新句子</button>
        </div>

        <div id="feedback" class="feedback">把詞語排成一句完整英文句子吧！</div>
      </section>

      <aside class="side">
        <h2>本級進度</h2>
        <div class="progress" aria-label="本級進度"><span id="progressBar"></span></div>
        <p class="score-line">答對：<span id="score">0</span> / 5 句</p>
        <button id="soundBtn" class="sound-toggle" type="button">音效：開</button>
        <p class="small">玩法：每題都會按文法即場創作。顏色幫助分辨詞語功能；只有句首詞語可以用 Aa 改變大小寫。每級答啱5句便完成該級。</p>
        <div id="levelMenu" class="level-menu" aria-label="level list"></div>
      </aside>
    </div>
  </main>

  <script>
    const levels = [
      { name: "Level 1：短句", detail: "人物、be 動詞和形容詞" },
      { name: "Level 2：動作句", detail: "人物、動作和物件" },
      { name: "Level 3：描寫句", detail: "人物、物件、形容詞和地點" },
      { name: "Level 4：情境句", detail: "時間、地點、人物和事情" },
      { name: "Level 5：複合句", detail: "完整情境、原因和連接詞" }
    ];

    const sentenceParts = {
      level1: {
        people: [
          { en: "I", zh: "我", be: "am", third: false },
          { en: "You", zh: "你", be: "are", third: false },
          { en: "He", zh: "他", be: "is", third: true },
          { en: "She", zh: "她", be: "is", third: true }
        ],
        feelings: [
          { en: "happy", zh: "高興" },
          { en: "kind", zh: "友善" },
          { en: "hungry", zh: "肚餓" },
          { en: "tired", zh: "疲倦" },
          { en: "brave", zh: "勇敢" }
        ]
      },
      level2: {
        people: [
          { en: "I", zh: "我", third: false },
          { en: "We", zh: "我們", third: false },
          { en: "Ben", zh: "Ben", third: true },
          { en: "Lily", zh: "Lily", third: true },
          { en: "My brother", zh: "我的哥哥", third: true }
        ],
        actions: [
          { base: "kick", third: "kicks", article: "the", noun: "ball", zh: "踢球" },
          { base: "read", third: "reads", article: "a", noun: "book", zh: "閱讀一本書" },
          { base: "drink", third: "drinks", noun: "water", zh: "喝水" },
          { base: "sing", third: "sings", article: "a", noun: "song", zh: "唱一首歌" },
          { base: "draw", third: "draws", article: "a", noun: "star", zh: "畫一顆星" }
        ]
      },
      level3: {
        people: [
          { en: "I", zh: "我", third: false },
          { en: "We", zh: "我們", third: false },
          { en: "Ben", zh: "Ben", third: true },
          { en: "Lily", zh: "Lily", third: true },
          { en: "My sister", zh: "我的姐姐", third: true }
        ],
        places: [
          { en: "at school", zh: "在學校" },
          { en: "in the classroom", zh: "在課室裏" },
          { en: "in the park", zh: "在公園裏" },
          { en: "at home", zh: "在家中" }
        ],
        items: [
          { article: "a", adjective: "red", noun: "bag", zh: "一個紅色書包" },
          { article: "a", adjective: "blue", noun: "kite", zh: "一隻藍色風箏" },
          { article: "a", adjective: "small", noun: "puppy", zh: "一隻小狗" },
          { article: "a", adjective: "new", noun: "book", zh: "一本新書" },
          { article: "a", adjective: "pretty", noun: "doll", zh: "一個漂亮洋娃娃" }
        ]
      },
      level4: {
        people: [
          { en: "I", zh: "我", third: false },
          { en: "We", zh: "我們", third: false },
          { en: "Ben", zh: "Ben", third: true },
          { en: "Lily", zh: "Lily", third: true },
          { en: "My brother", zh: "我的哥哥", third: true }
        ],
        times: [
          { en: "In the morning", zh: "早上" },
          { en: "After school", zh: "放學後" },
          { en: "In the afternoon", zh: "下午" },
          { en: "At lunchtime", zh: "午飯時間" },
          { en: "On Sunday", zh: "星期日" }
        ],
        scenes: [
          { base: "read", third: "reads", article: "an", adjective: "interesting", noun: "storybook", place: "in the library", actionZh: "閱讀一本有趣的故事書", placeZh: "在圖書館裏", times: ["In the morning", "After school", "In the afternoon", "On Sunday"] },
          { base: "play", third: "plays", article: "an", adjective: "exciting", noun: "game", place: "in the park", actionZh: "玩一個刺激的遊戲", placeZh: "在公園裏", times: ["After school", "In the afternoon", "On Sunday"] },
          { base: "draw", third: "draws", article: "a", adjective: "colourful", noun: "picture", place: "in the classroom", actionZh: "畫一幅色彩繽紛的圖畫", placeZh: "在課室裏", times: ["In the morning", "After school", "In the afternoon"] },
          { base: "eat", third: "eats", article: "a", adjective: "healthy", noun: "lunch", place: "at school", actionZh: "吃一頓健康的午餐", placeZh: "在學校", times: ["At lunchtime"] },
          { base: "ride", third: "rides", article: "a", adjective: "blue", noun: "bike", place: "in the playground", actionZh: "踏一架藍色單車", placeZh: "在遊樂場裏", times: ["After school", "In the afternoon", "On Sunday"] }
        ]
      },
      level5: {
        people: [
          { en: "I", zh: "我", third: false, pronoun: "I" },
          { en: "We", zh: "我們", third: false, pronoun: "we" },
          { en: "Ben", zh: "Ben", third: true, pronoun: "he" },
          { en: "Lily", zh: "Lily", third: true, pronoun: "she" },
          { en: "My sister", zh: "我的姐姐", third: true, pronoun: "she" }
        ],
        times: [
          { en: "After school", zh: "放學後" },
          { en: "On Saturday", zh: "星期六" },
          { en: "In the afternoon", zh: "下午" }
        ],
        scenes: [
          { base: "read", third: "reads", article: "an", adjective: "interesting", noun: "storybook", place: "in the library", actionZh: "閱讀一本有趣的故事書", placeZh: "在圖書館裏", times: ["After school", "On Saturday", "In the afternoon"] },
          { base: "play", third: "plays", article: "a", adjective: "friendly", noun: "match", place: "in the park", actionZh: "參加一場友誼比賽", placeZh: "在公園裏", times: ["After school", "On Saturday", "In the afternoon"] },
          { base: "draw", third: "draws", article: "a", adjective: "colourful", noun: "picture", place: "in the classroom", actionZh: "畫一幅色彩繽紛的圖畫", placeZh: "在課室裏", times: ["After school", "In the afternoon"] },
          { base: "practise", third: "practises", adjective: "spoken", noun: "English", place: "at school", actionZh: "練習英語會話", placeZh: "在學校", times: ["After school", "In the afternoon"] }
        ],
        reasons: [
          { adjective: "curious", zh: "充滿好奇心", scenes: ["read"] },
          { adjective: "hard-working", zh: "十分勤奮", scenes: ["practise"] },
          { adjective: "excited", zh: "感到興奮", scenes: ["read", "play"] },
          { adjective: "confident", zh: "充滿信心", scenes: ["play", "practise"] },
          { adjective: "creative", zh: "富有創意", scenes: ["draw"] },
          { adjective: "happy", zh: "感到開心", scenes: ["draw"] }
        ]
      }
    };

    const state = {
      level: 0,
      answer: [],
      bank: [],
      scores: [0, 0, 0, 0, 0],
      attempts: [0, 0, 0, 0, 0],
      solved: false,
      currentQuestion: null,
      lastSentenceByLevel: Array(levels.length).fill(""),
      soundOn: true,
      audio: null
    };

    const els = {
      title: document.getElementById("question-title"),
      level: document.getElementById("level"),
      meaning: document.getElementById("meaning"),
      answer: document.getElementById("answer"),
      wordBank: document.getElementById("wordBank"),
      feedback: document.getElementById("feedback"),
      score: document.getElementById("score"),
      progressBar: document.getElementById("progressBar"),
      soundBtn: document.getElementById("soundBtn"),
      levelMenu: document.getElementById("levelMenu")
    };

    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("clearBtn").addEventListener("click", resetCurrent);
    document.getElementById("hintBtn").addEventListener("click", showHint);
    document.getElementById("nextBtn").addEventListener("click", nextQuestion);
    els.soundBtn.addEventListener("click", toggleSound);

    function joinWords(words) {
      return words.join(" ").replace(/\s+([,.!?])/g, "$1");
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function token(text, type = "other") {
      return { text, type };
    }

    function objectTokens(item) {
      return [
        item.article ? token(item.article) : null,
        item.adjective ? token(item.adjective, "adjective") : null,
        token(item.noun)
      ].filter(Boolean);
    }

    function englishQuestion(zh, parts, elements = null) {
      return {
        zh,
        parts,
        sentence: joinWords(parts.map((part) => part.text)),
        elements
      };
    }

    function subjectAfterIntro(person) {
      if (["I", "Ben", "Lily"].includes(person.en)) return person.en;
      return person.en.charAt(0).toLowerCase() + person.en.slice(1);
    }

    function buildRandomQuestion(level) {
      if (level === 0) {
        const person = pick(sentenceParts.level1.people);
        const feeling = pick(sentenceParts.level1.feelings);
        return englishQuestion(`${person.zh}很${feeling.zh}。`, [
          token(person.en, "person"),
          token(person.be, "verb"),
          token(feeling.en, "adjective"),
          token(".")
        ]);
      }

      if (level === 1) {
        const person = pick(sentenceParts.level2.people);
        const action = pick(sentenceParts.level2.actions);
        const verb = person.third ? action.third : action.base;
        return englishQuestion(`${person.zh}${action.zh}。`, [
          token(person.en, "person"),
          token(verb, "verb"),
          ...objectTokens(action),
          token(".")
        ]);
      }

      if (level === 2) {
        const person = pick(sentenceParts.level3.people);
        const place = pick(sentenceParts.level3.places);
        const item = pick(sentenceParts.level3.items);
        const have = person.third ? "has" : "have";
        return englishQuestion(`${person.zh}${place.zh}有${item.zh}。`, [
          token(person.en, "person"),
          token(have, "verb"),
          ...objectTokens(item),
          token(place.en, "place"),
          token(".")
        ], { person: person.en, place: place.en, event: item.noun });
      }

      if (level === 3) {
        const person = pick(sentenceParts.level4.people);
        const scene = pick(sentenceParts.level4.scenes);
        const time = pick(sentenceParts.level4.times.filter((item) => scene.times.includes(item.en)));
        const verb = person.third ? scene.third : scene.base;
        return englishQuestion(`${time.zh}，${person.zh}${scene.placeZh}${scene.actionZh}。`, [
          token(time.en, "time"),
          token(","),
          token(subjectAfterIntro(person), "person"),
          token(verb, "verb"),
          ...objectTokens(scene),
          token(scene.place, "place"),
          token(".")
        ], { time: time.en, person: person.en, place: scene.place, event: scene.noun });
      }

      const person = pick(sentenceParts.level5.people);
      const scene = pick(sentenceParts.level5.scenes);
      const time = pick(sentenceParts.level5.times.filter((item) => scene.times.includes(item.en)));
      const reason = pick(sentenceParts.level5.reasons.filter((item) => item.scenes.includes(scene.base)));
      const verb = person.third ? scene.third : scene.base;
      const reasonBe = person.pronoun === "I" ? "am" : person.pronoun === "we" ? "are" : "is";
      const pronounZh = person.pronoun === "I" ? "我" : person.pronoun === "we" ? "我們" : person.pronoun === "he" ? "他" : "她";
      return englishQuestion(
        `${time.zh}，${person.zh}${scene.placeZh}${scene.actionZh}，因為${pronounZh}${reason.zh}。`,
        [
          token(time.en, "time"),
          token(","),
          token(subjectAfterIntro(person), "person"),
          token(verb, "verb"),
          ...objectTokens(scene),
          token(scene.place, "place"),
          token("because", "conjunction"),
          token(person.pronoun, "person"),
          token(reasonBe, "verb"),
          token(reason.adjective, "adjective"),
          token(".")
        ],
        { time: time.en, person: person.en, place: scene.place, event: scene.noun }
      );
    }

    function createRandomQuestion(level) {
      let question = buildRandomQuestion(level);
      for (let attempt = 0; attempt < 8 && question.sentence === state.lastSentenceByLevel[level]; attempt++) {
        question = buildRandomQuestion(level);
      }
      state.lastSentenceByLevel[level] = question.sentence;
      return question;
    }

    function loadQuestion(level, existingQuestion = null) {
      const question = existingQuestion || createRandomQuestion(level);
      const parts = question.parts.map((part) => ({ ...part }));

      if (Math.random() < 0.5) {
        parts[0].text = parts[0].text.charAt(0).toLowerCase() + parts[0].text.slice(1);
      }

      state.level = level;
      state.currentQuestion = question;
      state.answer = [];
      state.solved = Boolean(existingQuestion && state.solved);
      if (!existingQuestion) {
        state.attempts[level] += 1;
      }
      state.bank = shuffle(parts.map((part, partIndex) => ({
        id: `${level}-${state.attempts[level]}-${partIndex}-${part.text}`,
        text: part.text,
        type: part.type,
        caseAdjustable: partIndex === 0 && /[a-z]/i.test(part.text)
      })));

      els.title.textContent = `本級練習 ${state.attempts[level]}`;
      els.level.textContent = levels[level].name;
      els.meaning.textContent = question.zh;
      els.feedback.className = "feedback";
      els.feedback.textContent = "把詞語排成一句完整英文句子吧！";
      render();
    }

    function render() {
      renderWords(els.answer, state.answer, moveToBank, true);
      renderWords(els.wordBank, state.bank, moveToAnswer, false);
      els.score.textContent = Math.min(state.scores[state.level], 5);
      els.progressBar.style.width = `${Math.min(state.scores[state.level] / 5, 1) * 100}%`;
      renderLevelMenu();
    }

    function renderWords(container, words, handler, isAnswer) {
      container.innerHTML = "";
      words.forEach((word) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `${isAnswer ? "word answer-word" : "word"} ${word.type || "other"}`;
        button.textContent = word.text;
        button.setAttribute("aria-label", word.text === "." ? "period" : word.text);
        button.addEventListener("click", () => handler(word.id));

        if (!isAnswer || !word.caseAdjustable) {
          container.appendChild(button);
          return;
        }

        const token = document.createElement("span");
        token.className = "answer-token";
        token.appendChild(button);

        const caseButton = document.createElement("button");
        caseButton.type = "button";
        caseButton.className = "case-toggle";
        caseButton.textContent = "Aa";
        caseButton.title = "改變大小寫";
        caseButton.setAttribute("aria-label", `改變 ${word.text} 的大小寫`);
        caseButton.addEventListener("click", () => toggleWordCase(word.id));
        token.appendChild(caseButton);
        container.appendChild(token);
      });
    }

    function renderLevelMenu() {
      els.levelMenu.innerHTML = "";
      levels.forEach((level, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "level-jump",
          index === state.level ? "active" : "",
          state.scores[index] >= 5 ? "done" : ""
        ].filter(Boolean).join(" ");
        button.append(document.createTextNode(level.name));
        const detail = document.createElement("span");
        detail.textContent = level.detail;
        button.appendChild(detail);
        button.addEventListener("click", () => {
          playSound("next");
          loadQuestion(index);
        });
        els.levelMenu.appendChild(button);
      });
    }

    function moveToAnswer(id) {
      const word = takeWord(state.bank, id);
      if (!word) return;
      state.answer.push(word);
      playSound("tap");
      clearFeedback();
      render();
    }

    function moveToBank(id) {
      const word = takeWord(state.answer, id);
      if (!word) return;
      state.bank.push(word);
      playSound("back");
      clearFeedback();
      render();
    }

    function takeWord(list, id) {
      const index = list.findIndex((word) => word.id === id);
      if (index === -1) return null;
      return list.splice(index, 1)[0];
    }

    function toggleWordCase(id) {
      const word = state.answer.find((item) => item.id === id);
      if (!word) return;

      const firstCharacter = word.text.charAt(0);
      const isLowercase = firstCharacter === firstCharacter.toLowerCase();
      word.text = (isLowercase ? firstCharacter.toUpperCase() : firstCharacter.toLowerCase()) + word.text.slice(1);
      playSound("tap");
      clearFeedback();
      render();
    }

    function checkAnswer() {
      const current = state.currentQuestion;
      const answer = joinWords(state.answer.map((word) => word.text));

      if (answer === current.sentence) {
        if (!state.solved) {
          state.scores[state.level] += 1;
          state.solved = true;
        }
        els.feedback.className = "feedback good";
        els.feedback.textContent = state.scores[state.level] >= 5
          ? `太好了！你已完成 ${levels[state.level].name}！`
          : `答對了！${current.sentence}`;
        playSound("correct");
      } else if (answer.toLowerCase() === current.sentence.toLowerCase()) {
        els.feedback.className = "feedback try";
        els.feedback.textContent = "次序答啱了！請用句首詞語旁邊的 Aa 檢查大小寫。";
        playSound("wrong");
      } else {
        els.feedback.className = "feedback try";
        els.feedback.textContent = "差一點點，請再檢查詞語次序和標點。";
        playSound("wrong");
      }
      render();
    }

    function resetCurrent() {
      playSound("clear");
      loadQuestion(state.level, state.currentQuestion);
    }

    function showHint() {
      const expected = state.currentQuestion.parts.map((part) => part.text);
      const selected = state.answer.map((word) => word.text);
      const mismatch = selected.findIndex((word, index) => word !== expected[index]);
      const nextIndex = mismatch === -1 ? selected.length : mismatch;
      const next = expected[nextIndex] || expected[0];
      els.feedback.className = "feedback";
      els.feedback.textContent = `提示：下一個詞語是「${next}」`;
      playSound("hint");
    }

    function nextQuestion() {
      const nextLevel = state.scores[state.level] >= 5 && state.level < levels.length - 1
        ? state.level + 1
        : state.level;
      playSound("next");
      loadQuestion(nextLevel);
    }

    function clearFeedback() {
      els.feedback.className = "feedback";
      els.feedback.textContent = "很好，繼續排下去。";
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      els.soundBtn.textContent = state.soundOn ? "音效：開" : "音效：關";
      if (state.soundOn) {
        playSound("hint");
      }
    }

    function getAudio() {
      if (!state.audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        state.audio = new AudioContext();
      }
      if (state.audio.state === "suspended") {
        state.audio.resume();
      }
      return state.audio;
    }

    function playSound(kind) {
      if (!state.soundOn) return;
      const audio = getAudio();
      if (!audio) return;

      const sounds = {
        tap: [{ frequency: 520, start: 0, duration: 0.08, type: "sine", volume: 0.12 }],
        back: [{ frequency: 330, start: 0, duration: 0.07, type: "triangle", volume: 0.1 }],
        hint: [
          { frequency: 660, start: 0, duration: 0.08, type: "sine", volume: 0.11 },
          { frequency: 880, start: 0.08, duration: 0.1, type: "sine", volume: 0.11 }
        ],
        next: [
          { frequency: 440, start: 0, duration: 0.08, type: "triangle", volume: 0.1 },
          { frequency: 660, start: 0.08, duration: 0.1, type: "triangle", volume: 0.1 }
        ],
        clear: [{ frequency: 260, start: 0, duration: 0.09, type: "sine", volume: 0.08 }],
        wrong: [
          { frequency: 220, start: 0, duration: 0.11, type: "sawtooth", volume: 0.06 },
          { frequency: 180, start: 0.1, duration: 0.13, type: "sawtooth", volume: 0.05 }
        ],
        correct: [
          { frequency: 523.25, start: 0, duration: 0.07, type: "triangle", volume: 0.12 },
          { frequency: 659.25, start: 0.07, duration: 0.07, type: "triangle", volume: 0.12 },
          { frequency: 783.99, start: 0.14, duration: 0.08, type: "triangle", volume: 0.13 },
          { frequency: 1046.5, start: 0.24, duration: 0.11, type: "sine", volume: 0.11 },
          { frequency: 1318.51, start: 0.34, duration: 0.12, type: "sine", volume: 0.09 },
          { frequency: 987.77, start: 0.39, duration: 0.1, type: "sine", volume: 0.07 }
        ]
      };

      (sounds[kind] || sounds.tap).forEach((note) => playNote(audio, note));
    }

    function playNote(audio, note) {
      const now = audio.currentTime + note.start;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.type = note.type;
      oscillator.frequency.setValueAtTime(note.frequency, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(note.volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + note.duration);

      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + note.duration + 0.03);
    }

    loadQuestion(0);
  </script>
</body>
</html>
