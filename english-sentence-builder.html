<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英文句子重組練習</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #637083;
      --paper: #fffaf0;
      --panel: #ffffff;
      --line: #d8dee8;
      --blue: #2563eb;
      --green: #17803d;
      --red: #c2410c;
      --yellow: #f7d154;
      --shadow: 0 18px 44px rgba(31, 41, 55, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(247, 209, 84, 0.35), transparent 28rem),
        radial-gradient(circle at 90% 15%, rgba(37, 99, 235, 0.16), transparent 24rem),
        linear-gradient(135deg, #fffaf0 0%, #f1f7ff 100%);
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: clamp(26px, 4vw, 42px);
      white-space: nowrap;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    .workspace,
    .side {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(216, 222, 232, 0.95);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .workspace {
      padding: clamp(18px, 3vw, 30px);
    }

    .side {
      padding: 18px;
      position: sticky;
      top: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 14px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #f8fbff;
    }

    .meaning {
      margin: 0 0 18px;
      padding: 16px;
      border-left: 8px solid var(--yellow);
      background: #fff7d6;
      border-radius: 6px;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      line-height: 1.2;
    }

    .zone-label {
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: clamp(19px, 2.6vw, 26px);
      font-weight: 800;
    }

    .sentence-box,
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      min-height: 104px;
      padding: 14px;
      border: 3px dashed #a8b3c5;
      border-radius: 8px;
      background: #f8fbff;
    }

    .sentence-box {
      min-height: 122px;
      background: #ffffff;
    }

    button {
      font: inherit;
    }

    .word {
      min-width: 72px;
      min-height: 58px;
      padding: 10px 16px;
      border: 3px solid #94a3b8;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font-size: clamp(26px, 4.4vw, 42px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
    }

    .word:hover,
    .word:focus-visible {
      border-color: var(--blue);
      outline: 4px solid rgba(37, 99, 235, 0.18);
    }

    .word:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .answer-word {
      background: #eaf3ff;
      border-color: var(--blue);
      box-shadow: 0 5px 0 #93c5fd;
    }

    .answer-token {
      display: inline-flex;
      align-items: stretch;
      gap: 5px;
    }

    .case-toggle {
      width: 48px;
      min-height: 58px;
      padding: 6px;
      border: 2px solid #64748b;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .case-toggle:hover,
    .case-toggle:focus-visible {
      border-color: var(--blue);
      outline: 4px solid rgba(37, 99, 235, 0.18);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .control {
      min-height: 58px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: clamp(18px, 2.7vw, 26px);
      font-weight: 900;
      cursor: pointer;
    }

    .check {
      background: var(--green);
    }

    .clear {
      background: #6b7280;
    }

    .hint {
      background: #7c3aed;
    }

    .next {
      background: var(--blue);
    }

    .feedback {
      min-height: 72px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #eef6ff;
      border: 2px solid #bfdbfe;
      font-size: clamp(24px, 3.7vw, 36px);
      font-weight: 900;
      line-height: 1.25;
    }

    .feedback.good {
      color: var(--green);
      background: #eafbea;
      border-color: #86efac;
    }

    .feedback.try {
      color: var(--red);
      background: #fff3e8;
      border-color: #fed7aa;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .progress {
      width: 100%;
      height: 22px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
      border: 2px solid #cbd5e1;
      margin: 12px 0 14px;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #2563eb);
      transition: width 180ms ease;
    }

    .score-line {
      margin: 10px 0;
      font-size: 24px;
      font-weight: 800;
    }

    .level-menu {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .sound-toggle {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: #0f766e;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      margin: 8px 0 4px;
    }

    .level-jump {
      min-height: 46px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
      padding: 8px 10px;
    }

    .level-jump.active {
      border-color: var(--blue);
      background: #eaf3ff;
      color: #1d4ed8;
    }

    .small {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.35;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 14px;
    }

    .dot {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #ffffff;
      font-size: 16px;
      font-weight: 900;
    }

    .dot.done {
      color: #ffffff;
      background: var(--green);
      border-color: var(--green);
    }

    @media (max-width: 850px) {
      main {
        padding: 14px;
      }

      .topbar,
      .app {
        grid-template-columns: 1fr;
      }

      .side {
        position: static;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .word {
        min-width: 64px;
      }
    }

    @media (max-width: 420px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>英文句子重組</h1>
      <div class="stars" aria-label="stars">★ ★ ★</div>
    </div>

    <div class="app">
      <section class="workspace" aria-labelledby="question-title">
        <div class="meta">
          <span id="question-title" class="pill">第 1 / 50 題</span>
          <span id="level" class="pill">Level 1</span>
        </div>

        <p id="meaning" class="meaning">中文意思</p>

        <div class="zone-label">我的句子</div>
        <div id="answer" class="sentence-box" aria-live="polite"></div>

        <div class="zone-label">請按正確次序點選英文單字</div>
        <div id="wordBank" class="word-bank"></div>

        <div class="controls">
          <button class="control check" type="button" id="checkBtn">檢查</button>
          <button class="control clear" type="button" id="clearBtn">重來</button>
          <button class="control hint" type="button" id="hintBtn">提示</button>
          <button class="control next" type="button" id="nextBtn">隨機新句子</button>
        </div>

        <div id="feedback" class="feedback">把單字排成一句完整英文吧！</div>
      </section>

      <aside class="side">
        <h2>進度</h2>
        <div class="progress" aria-label="progress"><span id="progressBar"></span></div>
        <p class="score-line">答對：<span id="score">0</span> 題</p>
        <p class="score-line">已完成：<span id="doneCount">0</span> / 50</p>
        <button id="soundBtn" class="sound-toggle" type="button">音效：開</button>
        <p class="small">玩法：點下面的英文單字，把它們放到「我的句子」。用 Aa 改變大小寫。每個 Level 都會按文法即場創作新句子。</p>
        <div id="levelMenu" class="level-menu" aria-label="level list"></div>
        <div id="questionDots" class="list" aria-label="question list"></div>
      </aside>
    </div>
  </main>

  <script>
    const levels = [
      "Level 1：短句",
      "Level 2：動作",
      "Level 3：物件和顏色",
      "Level 4：地點和時間",
      "Level 5：較長句子"
    ];

    const questions = [
      // Level 1: very short be-verb and like/have sentences.
      { zh: "我是一個男孩。", sentence: "I am a boy." },
      { zh: "我是一個女孩。", sentence: "I am a girl." },
      { zh: "你很高興。", sentence: "You are happy." },
      { zh: "他是我的爸爸。", sentence: "He is my dad." },
      { zh: "她是我的媽媽。", sentence: "She is my mom." },
      { zh: "這是一隻貓。", sentence: "It is a cat." },
      { zh: "那是一隻狗。", sentence: "That is a dog." },
      { zh: "我喜歡蘋果。", sentence: "I like apples." },
      { zh: "我喜歡香蕉。", sentence: "I like bananas." },
      { zh: "我有一支筆。", sentence: "I have a pen." },

      // Level 2: action words and can.
      { zh: "我有一個球。", sentence: "I have a ball." },
      { zh: "我看到一隻鳥。", sentence: "I see a bird." },
      { zh: "我看到一條魚。", sentence: "I see a fish." },
      { zh: "我可以跑。", sentence: "I can run." },
      { zh: "我可以跳。", sentence: "I can jump." },
      { zh: "我會唱歌。", sentence: "I can sing." },
      { zh: "我會游泳。", sentence: "I can swim." },
      { zh: "狗會跑。", sentence: "The dog can run." },
      { zh: "貓會跳。", sentence: "The cat can jump." },
      { zh: "鳥會飛。", sentence: "The bird can fly." },

      // Level 3: nouns, colors, adjectives, and simple requests.
      { zh: "太陽很熱。", sentence: "The sun is hot." },
      { zh: "冰是冷的。", sentence: "The ice is cold." },
      { zh: "我的書是紅色的。", sentence: "My book is red." },
      { zh: "我的書包是藍色的。", sentence: "My bag is blue." },
      { zh: "我的鞋子是新的。", sentence: "My shoes are new." },
      { zh: "這個球是大的。", sentence: "The ball is big." },
      { zh: "這隻貓是小的。", sentence: "The cat is small." },
      { zh: "我想要水。", sentence: "I want water." },
      { zh: "我想要牛奶。", sentence: "I want milk." },
      { zh: "我想要一塊餅乾。", sentence: "I want a cookie." },

      // Level 4: commands, places, and daily routines.
      { zh: "請坐下。", sentence: "Please sit down." },
      { zh: "請站起來。", sentence: "Please stand up." },
      { zh: "請打開門。", sentence: "Please open the door." },
      { zh: "請關上門。", sentence: "Please close the door." },
      { zh: "我在吃午餐。", sentence: "I eat lunch." },
      { zh: "我喝水。", sentence: "I drink water." },
      { zh: "我讀一本書。", sentence: "I read a book." },
      { zh: "我玩玩具。", sentence: "I play with toys." },
      { zh: "我們去學校。", sentence: "We go to school." },
      { zh: "我們在公園玩。", sentence: "We play in the park." },

      // Level 5: longer sentences with extra details.
      { zh: "這是我的老師。", sentence: "This is my teacher." },
      { zh: "這是我的好朋友。", sentence: "This is my good friend." },
      { zh: "我今天很高興。", sentence: "I am happy today." },
      { zh: "我早上喝牛奶。", sentence: "I drink milk in the morning." },
      { zh: "我放學後玩足球。", sentence: "I play football after school." },
      { zh: "她有一個漂亮的洋娃娃。", sentence: "She has a pretty doll." },
      { zh: "他有一輛紅色的車。", sentence: "He has a red car." },
      { zh: "我們在星期日去公園。", sentence: "We go to the park on Sunday." },
      { zh: "我喜歡我的老師，因為她很友善。", sentence: "I like my teacher because she is kind." },
      { zh: "我愛我的家人，因為他們幫助我。", sentence: "I love my family because they help me." }
    ];

    const sentenceParts = {
      level1: {
        people: [
          { en: "I", zh: "我", be: "am" },
          { en: "You", zh: "你", be: "are" },
          { en: "He", zh: "他", be: "is" },
          { en: "She", zh: "她", be: "is" }
        ],
        feelings: [
          { en: "happy", zh: "高興" },
          { en: "sad", zh: "傷心" },
          { en: "hungry", zh: "肚餓" },
          { en: "tired", zh: "疲倦" }
        ],
        likes: [
          { en: "apples", zh: "蘋果" },
          { en: "bananas", zh: "香蕉" },
          { en: "milk", zh: "牛奶" },
          { en: "books", zh: "圖書" }
        ]
      },
      level2: {
        abilities: [
          { subject: "I", subjectZh: "我", verb: "run", verbZh: "跑" },
          { subject: "I", subjectZh: "我", verb: "jump", verbZh: "跳" },
          { subject: "I", subjectZh: "我", verb: "sing", verbZh: "唱歌" },
          { subject: "She", subjectZh: "她", verb: "dance", verbZh: "跳舞" },
          { subject: "He", subjectZh: "他", verb: "swim", verbZh: "游泳" },
          { subject: "The dog", subjectZh: "狗", verb: "run", verbZh: "跑" },
          { subject: "The cat", subjectZh: "貓", verb: "jump", verbZh: "跳" },
          { subject: "The bird", subjectZh: "鳥", verb: "fly", verbZh: "飛" },
          { subject: "The fish", subjectZh: "魚", verb: "swim", verbZh: "游泳" }
        ],
        actions: [
          { en: "I kick the ball", zh: "我踢球" },
          { en: "I read a book", zh: "我讀一本書" },
          { en: "I drink water", zh: "我喝水" },
          { en: "We sing a song", zh: "我們唱一首歌" },
          { en: "We play a game", zh: "我們玩遊戲" }
        ]
      },
      level3: {
        things: [
          { en: "book", zh: "書" },
          { en: "bag", zh: "書包" },
          { en: "ball", zh: "球" },
          { en: "kite", zh: "風箏" },
          { en: "hat", zh: "帽" }
        ],
        descriptions: [
          { en: "red", zh: "紅色" },
          { en: "blue", zh: "藍色" },
          { en: "green", zh: "綠色" },
          { en: "big", zh: "大" },
          { en: "small", zh: "小" },
          { en: "new", zh: "新" }
        ],
        wants: [
          { en: "a cookie", zh: "一塊餅乾" },
          { en: "some water", zh: "一些水" },
          { en: "a red apple", zh: "一個紅蘋果" },
          { en: "a new toy", zh: "一件新玩具" }
        ]
      },
      level4: {
        routines: [
          { en: "read a book", zh: "讀一本書" },
          { en: "eat lunch", zh: "吃午餐" },
          { en: "drink milk", zh: "喝牛奶" },
          { en: "play football", zh: "踢足球" },
          { en: "draw a picture", zh: "畫一幅畫" }
        ],
        times: [
          { en: "in the morning", zh: "早上" },
          { en: "after school", zh: "放學後" },
          { en: "in the afternoon", zh: "下午" },
          { en: "on Sunday", zh: "星期日" }
        ],
        places: [
          { action: "read books", actionZh: "讀書", en: "in the library", zh: "圖書館" },
          { action: "play games", actionZh: "玩遊戲", en: "in the classroom", zh: "課室" },
          { action: "play football", actionZh: "踢足球", en: "in the park", zh: "公園" },
          { action: "eat lunch", actionZh: "吃午餐", en: "at school", zh: "學校" }
        ]
      },
      level5: {
        reasons: [
          { first: "I like my teacher", firstZh: "我喜歡我的老師", second: "she is kind", secondZh: "她很友善" },
          { first: "I love my family", firstZh: "我愛我的家人", second: "they help me", secondZh: "他們幫助我" },
          { first: "I like this book", firstZh: "我喜歡這本書", second: "it is funny", secondZh: "它很有趣" },
          { first: "He likes the park", firstZh: "他喜歡公園", second: "he can run there", secondZh: "他可以在那裏跑" },
          { first: "She likes music", firstZh: "她喜歡音樂", second: "she loves to sing", secondZh: "她喜歡唱歌" }
        ],
        events: [
          { feeling: "happy", feelingZh: "高興", event: "I play with my friends", eventZh: "我和朋友玩" },
          { feeling: "excited", feelingZh: "興奮", event: "we go to the park", eventZh: "我們去公園" },
          { feeling: "proud", feelingZh: "自豪", event: "I finish my homework", eventZh: "我完成家課" },
          { feeling: "calm", feelingZh: "平靜", event: "I read a book", eventZh: "我讀書" }
        ],
        pairs: [
          { first: "read books", firstZh: "讀書", second: "draw pictures", secondZh: "畫畫" },
          { first: "sing songs", firstZh: "唱歌", second: "dance with my friends", secondZh: "和朋友跳舞" },
          { first: "play football", firstZh: "踢足球", second: "ride my bike", secondZh: "踏單車" }
        ]
      }
    };

    const state = {
      index: 0,
      answer: [],
      bank: [],
      completed: new Set(),
      correct: new Set(),
      currentQuestion: null,
      lastSentenceByLevel: Array(levels.length).fill(""),
      soundOn: true,
      audio: null
    };

    const els = {
      title: document.getElementById("question-title"),
      level: document.getElementById("level"),
      meaning: document.getElementById("meaning"),
      answer: document.getElementById("answer"),
      wordBank: document.getElementById("wordBank"),
      feedback: document.getElementById("feedback"),
      score: document.getElementById("score"),
      doneCount: document.getElementById("doneCount"),
      progressBar: document.getElementById("progressBar"),
      soundBtn: document.getElementById("soundBtn"),
      levelMenu: document.getElementById("levelMenu"),
      dots: document.getElementById("questionDots")
    };

    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("clearBtn").addEventListener("click", resetCurrent);
    document.getElementById("hintBtn").addEventListener("click", showHint);
    document.getElementById("nextBtn").addEventListener("click", nextQuestion);
    els.soundBtn.addEventListener("click", toggleSound);

    function wordsFor(sentence) {
      return sentence.replace(".", " .").split(" ");
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function buildRandomQuestion(level) {
      if (level === 0) {
        if (Math.random() < 0.65) {
          const person = pick(sentenceParts.level1.people);
          const feeling = pick(sentenceParts.level1.feelings);
          return {
            zh: `${person.zh}很${feeling.zh}。`,
            sentence: `${person.en} ${person.be} ${feeling.en}.`
          };
        }
        const item = pick(sentenceParts.level1.likes);
        return { zh: `我喜歡${item.zh}。`, sentence: `I like ${item.en}.` };
      }

      if (level === 1) {
        if (Math.random() < 0.7) {
          const ability = pick(sentenceParts.level2.abilities);
          return {
            zh: `${ability.subjectZh}會${ability.verbZh}。`,
            sentence: `${ability.subject} can ${ability.verb}.`
          };
        }
        const action = pick(sentenceParts.level2.actions);
        return { zh: `${action.zh}。`, sentence: `${action.en}.` };
      }

      if (level === 2) {
        if (Math.random() < 0.7) {
          const thing = pick(sentenceParts.level3.things);
          const description = pick(sentenceParts.level3.descriptions);
          return {
            zh: `我的${thing.zh}是${description.zh}的。`,
            sentence: `My ${thing.en} is ${description.en}.`
          };
        }
        const wanted = pick(sentenceParts.level3.wants);
        return { zh: `我想要${wanted.zh}。`, sentence: `I want ${wanted.en}.` };
      }

      if (level === 3) {
        if (Math.random() < 0.55) {
          const routine = pick(sentenceParts.level4.routines);
          const time = pick(sentenceParts.level4.times);
          return {
            zh: `我${time.zh}${routine.zh}。`,
            sentence: `I ${routine.en} ${time.en}.`
          };
        }
        const place = pick(sentenceParts.level4.places);
        return {
          zh: `我們在${place.zh}${place.actionZh}。`,
          sentence: `We ${place.action} ${place.en}.`
        };
      }

      const pattern = Math.floor(Math.random() * 3);
      if (pattern === 0) {
        const reason = pick(sentenceParts.level5.reasons);
        return {
          zh: `${reason.firstZh}，因為${reason.secondZh}。`,
          sentence: `${reason.first} because ${reason.second}.`
        };
      }
      if (pattern === 1) {
        const event = pick(sentenceParts.level5.events);
        return {
          zh: `當${event.eventZh}時，我感到${event.feelingZh}。`,
          sentence: `I feel ${event.feeling} when ${event.event}.`
        };
      }
      const pair = pick(sentenceParts.level5.pairs);
      return {
        zh: `我放學後${pair.firstZh}和${pair.secondZh}。`,
        sentence: `I ${pair.first} and ${pair.second} after school.`
      };
    }

    function createRandomQuestion(level) {
      let question = buildRandomQuestion(level);
      for (let attempt = 0; attempt < 8 && question.sentence === state.lastSentenceByLevel[level]; attempt++) {
        question = buildRandomQuestion(level);
      }
      state.lastSentenceByLevel[level] = question.sentence;
      return question;
    }

    function loadQuestion(index, existingQuestion = null) {
      const level = levelFor(index);
      const question = existingQuestion || createRandomQuestion(level);
      const words = wordsFor(question.sentence);

      if (Math.random() < 0.5) {
        words[0] = words[0].toLowerCase();
      }

      state.index = index;
      state.currentQuestion = question;
      state.answer = [];
      state.bank = shuffle(words.map((text, wordIndex) => ({
        id: `${index}-${wordIndex}-${text}`,
        text
      })));

      els.title.textContent = `第 ${index + 1} / ${questions.length} 題`;
      els.level.textContent = levels[level];
      els.meaning.textContent = question.zh;
      els.feedback.className = "feedback";
      els.feedback.textContent = "把單字排成一句完整英文吧！";
      render();
    }

    function render() {
      renderWords(els.answer, state.answer, moveToBank, true);
      renderWords(els.wordBank, state.bank, moveToAnswer, false);
      els.score.textContent = state.correct.size;
      els.doneCount.textContent = state.completed.size;
      els.progressBar.style.width = `${(state.completed.size / questions.length) * 100}%`;
      renderLevelMenu();
      renderDots();
    }

    function renderWords(container, words, handler, isAnswer) {
      container.innerHTML = "";
      words.forEach((word) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = isAnswer ? "word answer-word" : "word";
        button.textContent = word.text;
        button.setAttribute("aria-label", word.text === "." ? "period" : word.text);
        button.addEventListener("click", () => handler(word.id));

        if (!isAnswer || !/[a-z]/i.test(word.text)) {
          container.appendChild(button);
          return;
        }

        const token = document.createElement("span");
        token.className = "answer-token";
        token.appendChild(button);

        const caseButton = document.createElement("button");
        caseButton.type = "button";
        caseButton.className = "case-toggle";
        caseButton.textContent = "Aa";
        caseButton.title = "改變大小寫";
        caseButton.setAttribute("aria-label", `改變 ${word.text} 的大小寫`);
        caseButton.addEventListener("click", () => toggleWordCase(word.id));
        token.appendChild(caseButton);
        container.appendChild(token);
      });
    }

    function renderDots() {
      els.dots.innerHTML = "";
      questions.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = state.completed.has(index) ? "dot done" : "dot";
        dot.textContent = index + 1;
        dot.addEventListener("click", () => loadQuestion(index));
        els.dots.appendChild(dot);
      });
    }

    function renderLevelMenu() {
      els.levelMenu.innerHTML = "";
      levels.forEach((label, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = index === levelFor(state.index) ? "level-jump active" : "level-jump";
        button.textContent = label;
        button.addEventListener("click", () => {
          playSound("next");
          loadQuestion(randomQuestionForLevel(index));
        });
        els.levelMenu.appendChild(button);
      });
    }

    function levelFor(index) {
      return Math.floor(index / 10);
    }

    function randomQuestionForLevel(level) {
      const start = level * 10;
      const unanswered = Array.from({ length: 10 }, (_, offset) => start + offset)
        .filter((index) => !state.completed.has(index));
      const choices = unanswered.length > 0
        ? unanswered
        : Array.from({ length: 10 }, (_, offset) => start + offset);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function moveToAnswer(id) {
      const word = takeWord(state.bank, id);
      if (!word) return;
      state.answer.push(word);
      playSound("tap");
      clearFeedback();
      render();
    }

    function moveToBank(id) {
      const word = takeWord(state.answer, id);
      if (!word) return;
      state.bank.push(word);
      playSound("back");
      clearFeedback();
      render();
    }

    function takeWord(list, id) {
      const index = list.findIndex((word) => word.id === id);
      if (index === -1) return null;
      return list.splice(index, 1)[0];
    }

    function toggleWordCase(id) {
      const word = state.answer.find((item) => item.id === id);
      if (!word) return;

      const isLowercase = word.text === word.text.toLowerCase();
      word.text = isLowercase
        ? word.text.charAt(0).toUpperCase() + word.text.slice(1)
        : word.text.toLowerCase();
      playSound("tap");
      clearFeedback();
      render();
    }

    function checkAnswer() {
      const current = state.currentQuestion;
      const answer = state.answer.map((word) => word.text).join(" ").replace(" .", ".");

      state.completed.add(state.index);
      if (answer === current.sentence) {
        state.correct.add(state.index);
        els.feedback.className = "feedback good";
        els.feedback.textContent = `答對了！${current.sentence}`;
        playSound("correct");
      } else if (answer.toLowerCase() === current.sentence.toLowerCase()) {
        state.correct.delete(state.index);
        els.feedback.className = "feedback try";
        els.feedback.textContent = "次序答啱了！請用 Aa 檢查英文大小寫。";
        playSound("wrong");
      } else {
        state.correct.delete(state.index);
        els.feedback.className = "feedback try";
        els.feedback.textContent = "差一點點，請再檢查單字次序和句號。";
        playSound("wrong");
      }
      render();
    }

    function resetCurrent() {
      playSound("clear");
      loadQuestion(state.index, state.currentQuestion);
    }

    function showHint() {
      const words = wordsFor(state.currentQuestion.sentence);
      const next = words[state.answer.length] || words[0];
      els.feedback.className = "feedback";
      els.feedback.textContent = `提示：下一個單字是「${next}」`;
      playSound("hint");
    }

    function nextQuestion() {
      const currentLevel = levelFor(state.index);
      const levelStart = currentLevel * 10;
      const levelIndexes = Array.from({ length: 10 }, (_, offset) => levelStart + offset);
      let choices = levelIndexes.filter((index) => (
        index !== state.index && !state.completed.has(index)
      ));

      if (choices.length === 0 && levelIndexes.every((index) => state.completed.has(index))) {
        const nextLevel = (currentLevel + 1) % levels.length;
        choices = Array.from({ length: 10 }, (_, offset) => nextLevel * 10 + offset);
      }

      if (choices.length === 0) {
        choices = levelIndexes.filter((index) => index !== state.index);
      }

      const next = choices[Math.floor(Math.random() * choices.length)];
      playSound("next");
      loadQuestion(next);
    }

    function clearFeedback() {
      els.feedback.className = "feedback";
      els.feedback.textContent = "很好，繼續排下去。";
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      els.soundBtn.textContent = state.soundOn ? "音效：開" : "音效：關";
      if (state.soundOn) {
        playSound("hint");
      }
    }

    function getAudio() {
      if (!state.audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        state.audio = new AudioContext();
      }
      if (state.audio.state === "suspended") {
        state.audio.resume();
      }
      return state.audio;
    }

    function playSound(kind) {
      if (!state.soundOn) return;
      const audio = getAudio();
      if (!audio) return;

      const sounds = {
        tap: [{ frequency: 520, start: 0, duration: 0.08, type: "sine", volume: 0.12 }],
        back: [{ frequency: 330, start: 0, duration: 0.07, type: "triangle", volume: 0.1 }],
        hint: [
          { frequency: 660, start: 0, duration: 0.08, type: "sine", volume: 0.11 },
          { frequency: 880, start: 0.08, duration: 0.1, type: "sine", volume: 0.11 }
        ],
        next: [
          { frequency: 440, start: 0, duration: 0.08, type: "triangle", volume: 0.1 },
          { frequency: 660, start: 0.08, duration: 0.1, type: "triangle", volume: 0.1 }
        ],
        clear: [{ frequency: 260, start: 0, duration: 0.09, type: "sine", volume: 0.08 }],
        wrong: [
          { frequency: 220, start: 0, duration: 0.11, type: "sawtooth", volume: 0.06 },
          { frequency: 180, start: 0.1, duration: 0.13, type: "sawtooth", volume: 0.05 }
        ],
        correct: [
          { frequency: 523.25, start: 0, duration: 0.07, type: "triangle", volume: 0.12 },
          { frequency: 659.25, start: 0.07, duration: 0.07, type: "triangle", volume: 0.12 },
          { frequency: 783.99, start: 0.14, duration: 0.08, type: "triangle", volume: 0.13 },
          { frequency: 1046.5, start: 0.24, duration: 0.11, type: "sine", volume: 0.11 },
          { frequency: 1318.51, start: 0.34, duration: 0.12, type: "sine", volume: 0.09 },
          { frequency: 987.77, start: 0.39, duration: 0.1, type: "sine", volume: 0.07 }
        ]
      };

      (sounds[kind] || sounds.tap).forEach((note) => playNote(audio, note));
    }

    function playNote(audio, note) {
      const now = audio.currentTime + note.start;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.type = note.type;
      oscillator.frequency.setValueAtTime(note.frequency, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(note.volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + note.duration);

      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + note.duration + 0.03);
    }

    loadQuestion(randomQuestionForLevel(0));
  </script>
</body>
</html>
