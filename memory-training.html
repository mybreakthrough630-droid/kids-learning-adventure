<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記憶力訓練 Memory Fun</title>
<link rel="stylesheet" href="memory-training.css?v=20260925">
<main>
  <header><span class="badge">★ MEMORY FUN</span><h1>記憶力小冒險</h1><p>看一看、記一記，發現每個位置的小秘密！</p></header>
  <section class="settings" aria-label="練習設定">
    <label>遊戲 <select id="game"><option value="cars">車車出發</option><option value="animals">動物派對</option><option value="dolls">公仔朋友</option><option value="food">美食記憶</option><option value="transport">交通出發</option><option value="gems">寶石記憶</option><option value="classic">圖案放回原位（原有遊戲）</option></select></label>
    <label>難度 <select id="level"><option value="easy">淺 · 30秒</option><option value="medium">中 · 30秒</option><option value="hard">難 · 45秒</option></select></label>
    <button id="new">開始新題</button>
  </section>
  <div class="status"><h2 id="heading">準備好挑戰嗎？</h2><span id="timer"></span></div>
  <p id="instruction" role="status" aria-live="polite">選擇難度，按「開始新題」。每題圖案及位置都會隨機變化。</p>
  <div id="palette" class="palette" aria-label="選擇要放的圖案" hidden></div>
  <p id="difficulty-note"></p>
  <div id="grid" class="grid" aria-label="記憶遊戲格"></div>
  <div class="actions"><button id="recall" hidden>我記住了，開始作答</button><button id="check" hidden>完成，核對答案</button><button id="retry" hidden>再試同一題</button></div>
  <section id="review" hidden><h2>原圖對照</h2><p>綠色係放啱嘅格；橙色係需要再練習嘅格。</p><div id="solution" class="grid"></div></section>
  <footer>淺、中模式有30秒觀察，困難模式有45秒。每次「開始新題」都重新抽選圖案及位置；「再試同一題」則保留原題。可以慢慢作答，不設作答限時。</footer>
</main>
<script src="memory-core.js?v=20260925"></script>
<script src="memory-art.js?v=20260925"></script>
<script src="memory-training.js?v=20260925"></script>
</html>
