<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶力冒險</title><link rel="stylesheet" href="adventure.css?v=20261001"></head><body><main class="wrap"><header><div><span class="eyebrow">Valerie&amp;Hilary冒險樂園</span><h1 id="title"></h1></div><a class="button" href="memory-adventure.html">← 遊戲選單</a></header><div class="toolbar"><label>難度 <select id="level"><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></label><button id="start" class="primary">開始遊戲</button><button id="sound" aria-pressed="false">♫ 音樂：關</button><span id="round">第 1 關</span><select id="scenePicker" class="scene-picker" aria-label="選擇找不同場景" hidden></select></div><p id="note"></p><p id="status" class="status" role="status" aria-live="polite">準備好嗎？</p><section id="board" class="board"><div id="slots" class="slots"></div></section><section id="pair" class="scene-pair" hidden></section><div id="palette" class="palette" hidden></div><div class="actions"><button id="undo" hidden>退一格</button><button id="check" class="primary" hidden>完成，核對答案</button><button id="retry" hidden>再試同一題</button><button id="hint" hidden>提示一處</button></div><div id="review" class="review" hidden></div><footer>先觀察，再作答；綠色 ✓ 表示記啱，橙色表示要再練習。成功後按「下一關」才繼續。</footer></main><section id="success" class="success" hidden aria-label="成功過關"><div class="success-box" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="trophy">🏆✨</div><h2 id="winTitle">全部記啱！</h2><p id="winText">你真係好叻，繼續下一個冒險啦！</p><button id="next" class="primary">下一關 →</button><button id="closeWin">查看答案</button></div></section><script src="adventure-data.js?v=20261001"></script><script src="adventure-game.js?v=20261001b"></script></body></html>
